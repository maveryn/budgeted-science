[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "budgeted-science"
version = "0.1.0"
description = "CPU scientific environments with explicit resource accounting"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2"]

[tool.setuptools.packages.find]
where = ["shared"]
include = ["budgeted_science*"]
